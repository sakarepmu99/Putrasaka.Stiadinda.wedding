name: Publish wedding invitation
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/configure-pages@v5
      - name: Prepare assets for project address
        working-directory: saka-dinda-cloudflare
        run: |
          python3 - <<'PY'
          from pathlib import Path
          base = '/Putrasaka.Stiadinda.wedding/'
          for folder in ('app', 'lib'):
              for p in Path(folder).rglob('*'):
                  if p.suffix in ('.tsx', '.ts', '.css'):
                      p.write_text(p.read_text().replace('/assets/', base + 'assets/'))
          p = Path('index.html')
          p.write_text(p.read_text().replace('/assets/', base + 'assets/').replace('/favicon.svg', base + 'favicon.svg'))
          PY
      - name: Build invitation
        working-directory: saka-dinda-cloudflare
        run: |
          npm install
          npm run build -- --base=/Putrasaka.Stiadinda.wedding/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: saka-dinda-cloudflare/dist
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4
